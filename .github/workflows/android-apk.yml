name: Android APK

# APK release signée (clé joutio-preview, comme joutio-mobile) : elle s'installe par-dessus l'ancienne app.
# Publiée en pré-release `apk-<run>` pour un test direct sur appareil. Pas encore de semantic-release.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://api.joutio.com
      EXPO_PUBLIC_IDENTITY_URL: https://identity.joutio.com
      EXPO_PUBLIC_OIDC_AUTHORITY: https://identity.joutio.com
      EXPO_PUBLIC_OIDC_CLIENT_ID: mobile
      EXPO_PUBLIC_SITE_URL: https://joutio.com
      # Phase de construction : le catalogue des composants reste la première page.
      EXPO_PUBLIC_CATALOG: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.config.ts', 'plugins/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --build-cache --parallel -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE="joutio-${VERSION}-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }} — v${{ steps.apk.outputs.version }}
          prerelease: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            APK release signée (arm64), API de production. Catalogue des composants en première page.
            Commit : ${{ github.sha }}
