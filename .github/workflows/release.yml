name: Release

# Comme les services : chaque push sur main passe par semantic-release (commits conventionnels). `feat` → mineure,
# `fix`/`perf` → correctif, `!`/BREAKING CHANGE → majeure ; `docs`, `chore`, `style`, `test` ne publient rien.
# Une version publiée met à jour package.json, package-lock.json et CHANGELOG.md (commit `chore(release)` [skip ci]),
# crée le tag vX.Y.Z et la release GitHub, puis y joint l'APK release signée (clé joutio-preview). Le versionCode
# suit la version (app.config.ts) : l'APK s'installe par-dessus la précédente.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

# Jamais d'annulation en cours de release : les pushes suivants attendent leur tour.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://api.joutio.com
      EXPO_PUBLIC_IDENTITY_URL: https://identity.joutio.com
      EXPO_PUBLIC_OIDC_AUTHORITY: https://identity.joutio.com
      EXPO_PUBLIC_OIDC_CLIENT_ID: mobile
      EXPO_PUBLIC_SITE_URL: https://joutio.com
      # Phase de construction : le catalogue des composants reste la première page.
      EXPO_PUBLIC_CATALOG: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Avant toute release : on ne tague jamais un code qui ne compile pas.
      - name: Typecheck
        run: npm run typecheck

      - name: Semantic Release
        id: release
        uses: joutio/joutio-reusable-workflows/actions/semantic-release@main
        with:
          node-version: '22'
          release-profile: npm
          github-token: ${{ secrets.JOUTIO_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v5
        if: steps.release.outputs.released == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode Android keystore
        if: steps.release.outputs.released == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # package.json porte déjà la nouvelle version (plugin npm) : app.config.ts en tire version et versionCode.
      - name: Expo prebuild (Android)
        if: steps.release.outputs.released == 'true'
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        if: steps.release.outputs.released == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.config.ts', 'plugins/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        if: steps.release.outputs.released == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --build-cache --parallel -PreactNativeArchitectures=arm64-v8a

      - name: Attach APK to the release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.JOUTIO_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          FILE="joutio-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$FILE"
          gh release upload "v${VERSION}" "$FILE" --clobber

      - name: Summary
        env:
          RELEASED: ${{ steps.release.outputs.released }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            echo "### Joutio v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            echo "- release et APK : https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Aucune release" >> "$GITHUB_STEP_SUMMARY"
            echo "Aucun commit \`feat\`, \`fix\` ou \`perf\` depuis le dernier tag : pas de version, pas d'APK." >> "$GITHUB_STEP_SUMMARY"
          fi
