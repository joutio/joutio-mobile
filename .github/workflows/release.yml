name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    uses: joutio/joutio-reusable-workflows/.github/workflows/mobile-release.yml@main
    with:
      service-name: joutio-mobile
      android-package: com.joutio.app
      api-url: https://api.joutio.com
      oidc-authority: https://identity.joutio.com
      oidc-client-id: mobile
      google-web-client-id: ${{ vars.JOUTIO_GOOGLE_WEB_CLIENT_ID }}
      facebook-app-id: ${{ vars.JOUTIO_FACEBOOK_APP_ID }}
      # Valeur publique (Client Token), configurée en variable de dépôt GitHub.
      # Vide = bouton Facebook masqué et plugin natif non ajouté.
      facebook-client-token: ${{ vars.JOUTIO_FACEBOOK_CLIENT_TOKEN }}
    secrets:
      GITHUB_PASSWORD: ${{ secrets.JOUTIO_GITHUB_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
